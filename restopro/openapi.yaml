components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          maxLength: 64
        entity:
          type: string
          maxLength: 64
        entity_id:
          type: string
          maxLength: 64
        old_value:
          nullable: true
        new_value:
          nullable: true
        reason:
          type: string
          maxLength: 255
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        user:
          type: string
          format: uuid
          nullable: true
        user_name:
          type: string
          readOnly: true
        device:
          type: string
          format: uuid
          nullable: true
        device_code:
          type: string
          readOnly: true
        branch:
          type: string
          format: uuid
          nullable: true
        ip:
          type: string
          nullable: true
      required:
      - action
      - created_at
      - device_code
      - id
      - user_name
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - refresh
      - user
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          description: Qisqa kod, masalan B1
          maxLength: 10
        address:
          type: string
          maxLength: 300
        phone:
          type: string
          maxLength: 20
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        service_charge_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        receipt_header:
          type: string
        receipt_footer:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
      - version
    BranchBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          description: Qisqa kod, masalan B1
          maxLength: 10
      required:
      - code
      - id
      - name
    BranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          minLength: 1
          description: Qisqa kod, masalan B1
          maxLength: 10
        address:
          type: string
          maxLength: 300
        phone:
          type: string
          maxLength: 20
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        service_charge_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        receipt_header:
          type: string
        receipt_footer:
          type: string
        is_active:
          type: boolean
      required:
      - code
      - name
    BusinessTypeEnum:
      enum:
      - NATIONAL
      - RESTAURANT
      - CAFE
      - FAST_FOOD
      - DARK_KITCHEN
      type: string
      description: |-
        * `NATIONAL` - Milliy oshxona (osh markazi, choyxona, somsaxona)
        * `RESTAURANT` - Restoran / to'yxona
        * `CAFE` - Kafe / kofeyniya
        * `FAST_FOOD` - Fast-food (lavash, burger)
        * `DARK_KITCHEN` - Yetkazib berish oshxonasi
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        business_type:
          allOf:
          - $ref: '#/components/schemas/BusinessTypeEnum'
          readOnly: true
        phone:
          type: string
          maxLength: 20
        legal_name:
          type: string
          maxLength: 200
        inn:
          type: string
          title: STIR (INN)
          maxLength: 20
        logo:
          type: string
          format: uri
          nullable: true
        currency:
          type: string
          maxLength: 10
        language:
          type: string
          maxLength: 5
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business_type
      - created_at
      - id
      - name
      - phone
      - status
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          readOnly: true
          description: Hujjat raqami prefiksi, masalan K1
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          readOnly: true
        branch:
          type: string
