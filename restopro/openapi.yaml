openapi: 3.0.3
info:
  title: RestoPro API
  version: 1.0.0
  description: Restoran, oshxona va kafe boshqaruv tizimi (multi-tenant SaaS)
paths:
  /api/v1/auth/audit-logs/:
    get:
      operationId: auth_audit_logs_list
      description: |-
        Tenant izolyatsiyasining ikkinchi qatlami.

        Manager allaqachon kontekst bo'yicha filtrlaydi; bu yerda esa so'rovdagi
        company bo'yicha aniq filtr qo'yiladi va yangi yozuvga company/branch
        majburan o'rnatiladi (mijoz yuborgan company_id e'tiborga olinmaydi).
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: branch
        schema:
          type: string
          format: uuid
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: device
        schema:
          type: string
          format: uuid
      - in: query
        name: entity
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - CRITICAL
          - INFO
          - WARNING
        description: |-
          * `INFO` - Info
          * `WARNING` - Warning
          * `CRITICAL` - Critical
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/audit-logs/{id}/:
    get:
      operationId: auth_audit_logs_retrieve
      description: |-
        Tenant izolyatsiyasining ikkinchi qatlami.

        Manager allaqachon kontekst bo'yicha filtrlaydi; bu yerda esa so'rovdagi
        company bo'yicha aniq filtr qo'yiladi va yangi yozuvga company/branch
