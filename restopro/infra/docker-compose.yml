name: restopro

x-backend: &backend
  build: ../backend
  env_file: .env
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # WAL arxivi — PITR (vaqt nuqtasiga tiklash) uchun
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on",
              "-c", "archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal-archive
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    ports: ["9001:9001"]
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [minio]
    env_file: .env
    entrypoint: >
      /bin/sh -c "sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/$${S3_BUCKET} && mc anonymous set download local/$${S3_BUCKET}; exit 0"

  backend:
    <<: *backend
    environment:
      RUN_MIGRATIONS: "1"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      retries: 10

  celery:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "4"]

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  web:
    build:
      context: ../web
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, web]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./backup:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /scripts/backup.sh; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  walarchive:
  redisdata:
  miniodata:
  backups:
