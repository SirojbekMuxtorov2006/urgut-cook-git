version: '3.8'

services:
  cloud_postgres:
    image: postgres:16-alpine
    container_name: oshxona_postgres_cloud
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cloudpostgrespassword
      POSTGRES_DB: oshxona_pos_cloud
    ports:
      - "5433:5432"
    volumes:
      - cloud_postgres_data:/var/lib/postgresql/data

volumes:
  cloud_postgres_data:
